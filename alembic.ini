[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
version_path_separator = os  # Use os.pathsep

# URL is overridden at runtime by env.py from settings
sqlalchemy.url = postgresql+asyncpg://user:pass@localhost/payment_db

[post_write_hooks]
# Run ruff formatter on generated migration files
hooks = ruff
ruff.type = exec
ruff.executable = %(here)s/.venv/bin/ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
